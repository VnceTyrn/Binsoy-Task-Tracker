<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Binsoy Treatment Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">
  <header>
    <div class="brand">
      <div class="logo"><img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%232dd4bf' d='M12 2c-1.7 0-3 1.1-3 2.5S10 7 12 7s3-1.1 3-2.5S13.7 2 12 2z'/><path fill='%231e293b' d='M6.5 8C4 8 2 10 2 12.5S4 17 6.5 17 11 15 11 12.5 9 8 6.5 8z'/><path fill='%23f8fafc' d='M17.5 8c2.5 0 4.5 2 4.5 4.5S20 17 17.5 17 13 15 13 12.5 15 8 17.5 8z'/></svg>" alt="logo"></div>
      <div class="brand-copy">
        <h1>Binsoy Treatment Tracker</h1>
        <p class="subtitle">Medication schedule, progress, and reminders.</p>
      </div>
    </div>
    <div class="header-actions">
      <button id="toggleTheme" class="ghost" type="button">🌙</button>
      <button id="toggleSettings" class="ghost" type="button">⚙️</button>
    </div>
  </header>
  <main>
    <section class="overview-card">
      <div class="overview-row">
        <div>
          <div class="overview-label">Task progress</div>
          <div id="completedCount" class="overview-value">0 / 0 complete</div>
        </div>
        <div>
          <div class="overview-label">Saved</div>
          <div id="lastSaved" class="overview-value">never</div>
        </div>
        <div>
          <div class="overview-label">Reminders</div>
          <div id="reminderStatus" class="overview-value">Off</div>
        </div>
      </div>
      <p class="overview-note">Use settings to save GitHub auth locally and enable reminders. The page works offline in the browser once loaded.</p>
    </section>
    <div class="controls">
      <button id="expandAll" class="ghost" type="button">Expand all</button>
      <button id="collapseAll" class="ghost" type="button">Collapse all</button>
    </div>
    <div id="alertBanner" class="alert-banner" style="display:none"></div>
    <div id="list"></div>
  </main>
  <footer>
    <button id="reset" class="ghost" type="button">Reset progress</button>
    <button id="save" type="button">Save progress</button>
  </footer>
  <script src="script.js" defer></script>
</body>
</html>
