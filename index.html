<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Binsoy Treatment Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo"><img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23ff7043' d='M12 2c-1.7 0-3 1.1-3 2.5S10 7 12 7s3-1.1 3-2.5S13.7 2 12 2z'/><path fill='%236d4c41' d='M6.5 8C4 8 2 10 2 12.5S4 17 6.5 17 11 15 11 12.5 9 8 6.5 8z'/><path fill='%23ffcc80' d='M17.5 8c2.5 0 4.5 2 4.5 4.5S20 17 17.5 17 13 15 13 12.5 15 8 17.5 8z'/></svg>" alt="dog"></div>
    <div>
      <h1>Binsoy Treatment Tracker</h1>
      <div class="subtitle">Pet-friendly — simple, mobile-first</div>
    </div>
    <div style="margin-left:auto" class="settings">
      <button id="toggleSettings" class="ghost">⚙️ Settings</button>
    </div>
  </header>
  <main>
    <div class="controls">
      <div class="left-controls">
        <div class="pill small muted" id="lastSaved">Last saved: never</div>
      </div>
      <div style="display:flex;gap:8px">
        <button id="expandAll" class="ghost">Expand All</button>
        <button id="collapseAll" class="ghost">Collapse All</button>
      </div>
    </div>

    <div id="list"></div>

    <div class="card" id="settingsPanel" style="display:none">
      <div style="display:flex;gap:8px;align-items:center;justify-content:space-between">
        <div>
          <div style="font-weight:700">Hidden Settings</div>
          <div class="small muted">Enter your GitHub token and repository (owner/repo) to enable cloud save.</div>
        </div>
        <div style="display:flex;gap:8px">
          <button id="saveSettings">Save</button>
          <button id="clearSettings" class="ghost">Clear</button>
        </div>
      </div>
      <div style="margin-top:12px;display:grid;gap:8px">
        <input id="token" placeholder="Personal access token" class="pill" style="padding:10px">
        <input id="repo" placeholder="Repository (owner/repo)" class="pill" style="padding:10px">
        <input id="path" placeholder="File path to save (tasks.json)" class="pill" style="padding:10px" value="tasks.json">
      </div>
    </div>

  </main>

  <footer>
    <button id="reset" class="ghost">Reset Progress</button>
    <button id="save" title="Save locally and to GitHub">Save Progress</button>
  </footer>
  <script src="script.js" defer></script>
</body>
</html>
